{% extends 'base.html' %}{% block content %}<h2>Analyze an image</h2><p>JPEG or PNG, up to 8 MB and 20 megapixels. The source image is processed in memory and is not saved.</p>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data"><label for="image">Image file</label><input id="image" type="file" name="image" accept="image/jpeg,image/png" required><button type="submit">Extract features</button></form>{% endblock %}
