name: CI and validated source delivery

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code
        run: ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check syntax
        run: python -m compileall -q app.py analysis.py

      - name: Package validated source
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/research-tool.zip HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: validated-source-python-${{ matrix.python-version }}
          path: dist/research-tool.zip
          if-no-files-found: error
