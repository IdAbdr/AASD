name: skinlab-a5-cloud
services:
  jenkins:
    build:
      context: ../jenkins
    # This isolated teaching controller controls only the Codespaces lab daemon.
    # Root avoids a host-specific socket group ID. Keep port 8080 private.
    user: "0:0"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      JAVA_OPTS: -Xms256m -Xmx1024m
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL:-}
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins-home:/var/jenkins_home
    restart: unless-stopped
volumes:
  jenkins-home:
